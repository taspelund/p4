[package]
name = "x4c-lsp"
version = "0.1.0"
edition = "2021"
description = "Target-agnostic P4-16 language server"

[dependencies]
lsp-server = "0.7"
lsp-types = "=0.95.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true
